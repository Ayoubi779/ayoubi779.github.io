<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beating Heart</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            border: 10px solid #ffb6c1;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
        }

        .heart {
            position: relative;
            width: 20vmin;
            height: 20vmin;
            background-color: pink;
            transform: rotate(-45deg);
            animation: beat 1s infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 20vmin;
            height: 20vmin;
            background-color: pink;
            border-radius: 50%;
        }

        .heart::before {
            top: -10vmin;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 10vmin;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1) rotate(-45deg);
            }
            50% {
                transform: scale(1.1) rotate(-45deg);
            }
        }

        .text {
            margin-top: 50px;
            font-family: Arial, sans-serif;
            font-size: 1.5rem;
            color: #ff69b4;
        }
    </style>
</head>
<body>
    <div class="heart"></div>
    <div class="text">I love you sooooo much</div>
</body>
</html>
